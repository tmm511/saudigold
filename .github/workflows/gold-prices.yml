name: Gold prices

on:
  schedule:
    # Every 5 minutes — the shortest interval GitHub Actions allows. Runs are
    # queued rather than precise, so expect a few minutes of drift when GitHub
    # is busy.
    #
    # This frequency REQUIRES a public repository. Public repos have unlimited
    # Actions minutes; a private one gets 2,000/month and this schedule would
    # burn roughly 8,640, dying about a week into every month. If this repo is
    # ever made private, drop back to hourly ('0 * * * *').
    - cron: '*/5 * * * *'
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

concurrency:
  group: gold-prices
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run post
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          AUTO_CHANNEL_ID: ${{ secrets.AUTO_CHANNEL_ID }}
          AUTO_MODE: edit

      # Render's free web services sleep after ~15 minutes without inbound
      # traffic, and a Discord bot never receives any. This job already runs on
      # a schedule, so it doubles as the keepalive ping.
      #
      # Set the RENDER_URL repository VARIABLE (Settings -> Secrets and
      # variables -> Actions -> Variables) to the service URL. Skipped when
      # unset, and a failed ping never fails the price update.
      - name: Keep the Render service awake
        if: vars.RENDER_URL != ''
        continue-on-error: true
        run: curl -fsS --max-time 30 "${{ vars.RENDER_URL }}" || echo 'keepalive ping failed'
