name: Gold prices

on:
  schedule:
    # Every 15 minutes. This is a BACKUP: the always-on deployment does the
    # live updating, and this covers the case where that host is down.
    #
    # Deliberately not '*/5'. GitHub queues scheduled runs and deprioritises
    # frequent crons when runners are busy — a */5 schedule on this repo did
    # not fire once in the half hour after it was enabled. Less frequent
    # schedules are honoured far more reliably, and for a backup that matters
    # more than resolution.
    #
    # Requires a public repository for unlimited Actions minutes. If this repo
    # is made private, drop to hourly ('0 * * * *') to stay inside the 2,000
    # minute monthly allowance.
    - cron: '*/15 * * * *'
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

concurrency:
  group: gold-prices
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run post
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          AUTO_CHANNEL_ID: ${{ secrets.AUTO_CHANNEL_ID }}
          AUTO_MODE: edit

      # Render's free web services sleep after ~15 minutes without inbound
      # traffic, and a Discord bot never receives any. This job already runs on
      # a schedule, so it doubles as the keepalive ping.
      #
      # Set the RENDER_URL repository VARIABLE (Settings -> Secrets and
      # variables -> Actions -> Variables) to the service URL. Skipped when
      # unset, and a failed ping never fails the price update.
      - name: Keep the Render service awake
        if: vars.RENDER_URL != ''
        continue-on-error: true
        run: curl -fsS --max-time 30 "${{ vars.RENDER_URL }}" || echo 'keepalive ping failed'
