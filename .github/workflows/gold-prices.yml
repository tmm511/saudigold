name: Gold prices

on:
  schedule:
    # Hourly. GitHub queues scheduled runs, so expect a few minutes of drift —
    # this is not a to-the-second cron.
    #
    # Deliberately not more frequent: this repo is private, so it draws on the
    # free 2,000 Actions minutes/month, and GitHub rounds every run up to a
    # whole minute. Hourly is ~720 minutes/month with plenty of headroom;
    # every 30 minutes would be ~1,440 and could exhaust the allowance mid-month,
    # stopping updates until it resets. A public repo has unlimited minutes and
    # could safely run more often.
    - cron: '0 * * * *'
  workflow_dispatch: # lets you trigger a run by hand from the Actions tab

concurrency:
  group: gold-prices
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - run: npm run post
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          AUTO_CHANNEL_ID: ${{ secrets.AUTO_CHANNEL_ID }}
          AUTO_MODE: edit
